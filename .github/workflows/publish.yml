name: Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'An exact version to publish from master, such as 1.3.0. Leave empty to publish the next version worked out from version.txt.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Eplicta/ArchiveReport'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Work out the version
        id: version
        env:
          EXACT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$EXACT_VERSION" ]]; then
            if ! [[ "$EXACT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "The version '$EXACT_VERSION' is not <major>.<minor>.<patch> with an optional -<prerelease>." >&2
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "An exact version can only be published from master, not from $GITHUB_REF." >&2
              exit 1
            fi
            VERSION="$EXACT_VERSION"
          else
            BASE="$(tr -d '[:space:]' < version.txt)"
            if ! [[ "$BASE" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
              echo "version.txt must hold <major>.<minor>, not '$BASE'." >&2
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack Eplicta.Conserver.ArchiveReport/Eplicta.Conserver.ArchiveReport.csproj --configuration Release --no-build --output artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" artifacts/*.nupkg --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
